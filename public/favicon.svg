<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="smkBagGrad" x1="8" y1="12" x2="32" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e5436"/>
      <stop offset="100%" stop-color="#123823"/>
    </linearGradient>
    <linearGradient id="smkSmileGrad" x1="13" y1="28" x2="27" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Circular background for perfect visibility in light and dark mode browser tabs -->
  <circle cx="20" cy="20" r="19" fill="#f8faf9" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Bag Handle -->
  <path d="M15 13C15 9.2 17 6.8 20 6.8C23 6.8 25 9.2 25 13" 
        stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- Modern Bag Body -->
  <path d="M10 13C10 12.2 10.6 11.5 11.5 11.5H28.5C29.4 11.5 30 12.2 30 13L31.8 30.8C32 32.8 30.5 34.5 28.5 34.5H11.5C9.5 34.5 8 32.8 8.2 30.8L10 13Z" 
        fill="url(#smkBagGrad)"/>

  <!-- Bold Modern 'S' -->
  <text x="20" y="21.5" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="14.5" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="central"
        letter-spacing="-0.03em">S</text>

  <!-- Dynamic Smile Curve -->
  <path d="M14 28.5C17 30.6 22 30.6 25 28.5" 
        stroke="url(#smkSmileGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M23.5 28.8L25.5 28.5L25 26.8" 
        stroke="url(#smkSmileGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
